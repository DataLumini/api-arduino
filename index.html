<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Grafico de luminosidade</h1>
    <div style="display: flex; align-items: center; justify-content: center;">
        <div style="width: 80%;">
            <canvas id="sensorLuminosidade"></canvas>
        </div>
    </div>

    <script>
        var sensorLuminosidade = new Chart(document.getElementById('sensorLuminosidade').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Luminosidade',
                    borderColor: '#ED145B',
                    backgroundColor: '#ED145B',
                    data: []
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'PPFD'
                        },
                        beginAtZero: true,
                    },
                },
            }
        });

        var tempo = 0;

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    let leituraMaisRecente = valores[valores.length - 1];

                    if (leituraMaisRecente != null) {
                        if (grafico.data.labels.length >= 10 && grafico.data.datasets[0].data.length >= 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo++);
                        grafico.data.datasets[0].data.push(parseFloat(leituraMaisRecente));

                        grafico.update();
                    }
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(sensorLuminosidade, 'luminosidade');
        }, 10000);

    </script>
</body>

</html>
